name: 'Dependency Review'
on:
  workflow_call:
  workflow_dispatch:
  

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v6
        with:
          ref: master
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5
