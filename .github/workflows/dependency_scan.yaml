name: Dependency Review

on:
  workflow_dispatch:
    inputs:
      base_ref:
        required: true
      head_ref:
        required: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/dependency-review-action@v5
        with:
          base-ref: ${{ inputs.base_ref }}
          head-ref: ${{ inputs.head_ref }}
