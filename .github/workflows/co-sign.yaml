name: Security - Cosign Image Signing

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sign-image:
    runs-on: ubuntu-latest

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get latest image digest
        id: image
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name new-repo \
            --region us-east-1 \
            --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageDigest' \
            --output text)

          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/new-repo@$DIGEST"

          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Sign image
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_KEY --yes \
          "${{ steps.image.outputs.image_uri }}"

      - name: Verify image
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          cosign verify \
          --key env://COSIGN_PUBLIC_KEY \
          "${{ steps.image.outputs.image_uri }}"
