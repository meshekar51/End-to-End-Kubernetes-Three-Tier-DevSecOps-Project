
name: FRONTEND-CI-CD-cosign

on:
  push:
    branches:
      - main
    paths:
      - 'Application-Code/frontend/**'

  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. AWS Authentication (only once)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. ECR Login (only once)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build and Push
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./Application-Code/frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            
              
      
      - name: Update frontend deployment image
        env:
            IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
            set -euo pipefail
        
            FILE="Kubernetes-Manifests-file/Frontend/deployment.yaml"
        
            echo "===== BEFORE ====="
            grep -nE '^[[:space:]]*image:' "$FILE"
        
            echo "===== NEW IMAGE ====="
            echo "$IMAGE_URI"
        
            sed -i -E \
              "s|^([[:space:]]*)image:.*$|\1image: ${IMAGE_URI}|" \
              "$FILE"
        
            echo "===== AFTER ====="
            grep -nE '^[[:space:]]*image:' "$FILE"
        
            echo "===== GIT DIFFERENCE ====="
            git diff -- "$FILE"
        
            if git diff --quiet -- "$FILE"; then
              echo "No image changes detected."
              exit 0
            fi
        
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
            git add "$FILE"
            git commit -m "Update frontend image to verified digest"
            git push origin HEAD:main
        
            echo "Manifest pushed successfully to main"

      # 6. Install Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # 7. Sign image
      - name: Sign Docker image
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign \
            --key env://COSIGN_KEY \
            --yes \
            "$IMAGE_URI"

      # 8. Verify signature
      - name: Verify Docker image signature
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --key env://COSIGN_PUBLIC_KEY \
            "$IMAGE_URI"

      # 9. Success
      - name: Show signed image
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Successfully built, signed and verified:"
          echo "$IMAGE_URI"
